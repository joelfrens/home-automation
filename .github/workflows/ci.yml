# Runs on every push and pull request. Each job checks one part of the system.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingestion:
    name: Ingestion (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ingestion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  firmware:
    name: Firmware (ESP32 compile)
    runs-on: ubuntu-latest
    env:
      SKETCH: firmware/atom_bme280_mqtt
      FQBN: esp32:esp32:esp32 # "ESP32 Dev Module"
      ESP32_CORE: "3.3.12"
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4

      # The ESP32 toolchain is several hundred MB; cache it between runs.
      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ env.ESP32_CORE }}-v1

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "Adafruit BME280 Library@2.3.0" "PubSubClient@2.8"

      # Real credentials are never in the repo; compile with the placeholder values.
      - name: Create placeholder secrets.h
        run: cp "$SKETCH/secrets.example.h" "$SKETCH/secrets.h"

      - name: Compile sketch
        run: arduino-cli compile --fqbn "$FQBN" --warnings default "$SKETCH"

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
