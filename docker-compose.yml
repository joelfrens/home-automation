# Settings shared by every container that runs the Laravel app (web, reverb, mqtt-listener, queue, scheduler).
# Inside Docker, other services are reached by service name. These override web/.env
# (which keeps localhost addresses for artisan commands run directly on the Mac).
x-laravel-env: &laravel-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: home
  DB_USERNAME: home
  DB_PASSWORD: home_dev_password
  MQTT_HOST: mosquitto
  MQTT_PORT: "1883"
  MQTT_USERNAME: laravel
  MQTT_PASSWORD: ${MQTT_LARAVEL_PASSWORD:?set MQTT_LARAVEL_PASSWORD in .env (copy .env.example)}
  REVERB_HOST: reverb             # where Laravel sends broadcasts (the browser uses the page's host instead)
  REVERB_PORT: "8080"
  REVERB_SCHEME: http

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-mosquitto
    # Creates the users from .env, then starts the broker (no anonymous access).
    command: sh /mosquitto/entrypoint.sh
    environment:
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?set MQTT_ADMIN_PASSWORD in .env (copy .env.example)}
      MQTT_SENSOR_PASSWORD: ${MQTT_SENSOR_PASSWORD:?set MQTT_SENSOR_PASSWORD in .env}
      MQTT_INGESTION_PASSWORD: ${MQTT_INGESTION_PASSWORD:?set MQTT_INGESTION_PASSWORD in .env}
      MQTT_LARAVEL_PASSWORD: ${MQTT_LARAVEL_PASSWORD:?set MQTT_LARAVEL_PASSWORD in .env}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: home-postgres
    environment:
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home_dev_password
      POSTGRES_DB: home
    ports:
      - "5433:5432"   # 5433 on the Mac: Homebrew Postgres already uses 5432
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Tables are created by Laravel migrations: docker compose exec web php artisan migrate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: home-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminer:   # web UI for browsing the database (like phpMyAdmin)
    image: adminer:4
    container_name: home-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped

  web:   # Laravel + React app (FrankenPHP serves Laravel's public/ folder)
    build:
      context: ./web
      target: dev                 # Dockerfile stage with PHP + Node (see web/Dockerfile)
    image: home-web
    container_name: home-web
    ports:
      - "8000:80"
    environment:
      <<: *laravel-env
      SERVER_NAME: ":80"          # FrankenPHP: plain HTTP on port 80 inside the container
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama on the host (automatic on Mac, needed on Linux/Pi)
    volumes:
      - ./web:/app                # live code from the Mac, no rebuild needed when editing
      - ./packages:/packages      # our Composer packages (web/composer.json: path repository ../packages/*)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  vite:   # development only: compiles React/TypeScript and hot-reloads the browser
    image: home-web               # same image as "web" (needs PHP for Wayfinder + Node for Vite)
    depends_on:
      - web
    container_name: home-vite
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - ./packages:/packages      # Wayfinder runs artisan, which loads the packages
      - web-node-modules:/app/node_modules   # Linux packages, kept separate from the Mac's node_modules
    healthcheck:
      disable: true               # the image's built-in check is for the PHP web server, which this container doesn't run
    restart: unless-stopped

  reverb:   # WebSocket server: pushes broadcasts (e.g. new readings) to open dashboards
    image: home-web               # same Laravel code, different command
    container_name: home-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"               # browsers connect to ws://<this machine>:8080
    environment:
      <<: *laravel-env
    volumes:
      - ./web:/app
      - ./packages:/packages
    depends_on:
      - web
    healthcheck:
      disable: true               # the image's built-in check is for the PHP web server
    restart: unless-stopped

  mqtt-listener:   # php artisan mqtt:listen: MQTT message -> validate -> broadcast via Reverb
    image: home-web
    container_name: home-mqtt-listener
    command: php artisan mqtt:listen
    environment:
      <<: *laravel-env
    volumes:
      - ./web:/app
      - ./packages:/packages
    depends_on:
      - mosquitto
      - reverb
    healthcheck:
      disable: true
    restart: unless-stopped     # also covers "broker not up yet" at start: it exits, Docker retries

  queue:   # runs queued jobs, e.g. sending reminder notifications to phones (ntfy)
    image: home-web
    container_name: home-queue
    command: php artisan queue:work --tries=3 --backoff=30
    environment:
      <<: *laravel-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/app
      - ./packages:/packages
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  scheduler:   # Laravel's clock: runs reminders:send every minute (see RemindersServiceProvider)
    image: home-web
    container_name: home-scheduler
    command: php artisan schedule:work
    environment:
      <<: *laravel-env
    volumes:
      - ./web:/app
      - ./packages:/packages
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  web-node-modules:
  mosquitto-data:
  pg-data:
  grafana-data:
