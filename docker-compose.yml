services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: home-postgres
    environment:
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home_dev_password
      POSTGRES_DB: home
    ports:
      - "5433:5432"   # 5433 on the Mac: Homebrew Postgres already uses 5432
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Tables are created by Laravel migrations: docker compose exec web php artisan migrate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: home-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminer:   # web UI for browsing the database (like phpMyAdmin)
    image: adminer:4
    container_name: home-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped

  web:   # Laravel + React app (FrankenPHP serves Laravel's public/ folder)
    build:
      context: ./web
      target: dev                 # Dockerfile stage with PHP + Node (see web/Dockerfile)
    image: home-web
    container_name: home-web
    ports:
      - "8000:80"
    environment:
      SERVER_NAME: ":80"          # FrankenPHP: plain HTTP on port 80 inside the container
      # Inside Docker, reach Postgres by service name. These override web/.env
      # (which keeps localhost:5433 for artisan commands run directly on the Mac).
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: home
      DB_USERNAME: home
      DB_PASSWORD: home_dev_password
    volumes:
      - ./web:/app                # live code from the Mac, no rebuild needed when editing
      - ./packages:/packages      # our Composer packages (web/composer.json: path repository ../packages/*)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  vite:   # development only: compiles React/TypeScript and hot-reloads the browser
    image: home-web               # same image as "web" (needs PHP for Wayfinder + Node for Vite)
    depends_on:
      - web
    container_name: home-vite
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - ./packages:/packages      # Wayfinder runs artisan, which loads the packages
      - web-node-modules:/app/node_modules   # Linux packages, kept separate from the Mac's node_modules
    healthcheck:
      disable: true               # the image's built-in check is for the PHP web server, which this container doesn't run
    restart: unless-stopped

volumes:
  web-node-modules:
  mosquitto-data:
  pg-data:
  grafana-data:
