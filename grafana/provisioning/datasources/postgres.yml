apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: home-postgres          # fixed id so dashboards can refer to it
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: home
    isDefault: true
    jsonData:
      database: home
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: home_dev_password
