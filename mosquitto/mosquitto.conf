# Every client must log in. Users and passwords are created at container start by
# entrypoint.sh from the MQTT_*_PASSWORD values in the repo-root .env (never in git).
# What each user may read/write is in the acl file next to this one (copied at start).
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
# A private copy of ./acl, made by entrypoint.sh (no comments after values in this file)
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
